- id: rx-eq
  name: eQ
  kind: 受信機
  part_of: nro45m
  depends_on: [nro45m, if-system]
  status: 試験中
  introduced: 台湾の中央研究院が開発。2021年11月25日に搭載（45m 鏡に外国で開発された受信機を載せるのは初めて）。搭載の審査（installation review）を通過している
  maintenance: {by: 大学など外部, condition: 試験と科学評価（CSV）の段階, effort: 小}
  renewal: データがそろえば受け入れの審査（acceptance review）を行い、通れば観測所に運用が引き継がれる
  owner_role: 所外（受け入れの後は観測所に引き継ぐ）
  maintainers: 0
  sources:
    - 状態、保守、引き継ぎの見込み：聞き取り2026-11-18-2 問1、問3
    - 開発と搭載：40周年記念誌 p.69
  note: 所外の装置。maintainers は所内で単独で判断できる人の数（0）。Z45 と同じ周波数帯で、稼働すると Z45 は運用を終える可能性がある。担い手の種類は「所外」と聞いたもので、大学か否かは未確認

