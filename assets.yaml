  maintenance: {by: 未記入, condition: 未記入, effort: 未記入}
  renewal: 未記入
  owner_role: 未定
  maintainers: 未記入
  docs: データシート
  sources:
    - 状態と提供：データシート
    - 導入：年次報告2009、技術シンポ2019
  note: 改修は大学のグループによる。保守を誰が担うかは未確認。単一鏡の観測だけに提供し、VLBI モードは調整中で使えない（プロポーザルの募集 https://www.nro.nao.ac.jp/projects/45m/proposals/calls/ ）

