# 資産の台帳：45m 鏡の受信機
# 項目の定義はハブの assets/README.md を参照。
#   https://github.com/nobeyama-radio-observatory/nro-context/blob/main/assets/README.md
# 2026-11-18 に、ハブの仮置きの台帳（assets/nro45m.yaml）から移した（判断記録 0006）。
# 公開資料から AI が埋め、聞き取り（interviews/）で補った。
#
# 受信機に共通する保守：夏に年1回、手間は小（聞き取り2026-11-18-2 問2）。
# 保守は受信機の部品ごとに分かれている（聞き取り2026-11-18-2 問3）。
#
# この台帳にない id の置き場所は、ハブの assets/README.md の資産の索引で引ける。
# nro45m は nro-45m-antenna、if-system はハブの assets/nro45m.yaml（運用リポジトリができるまで）。
#
# 出典の略記
#   データシート：45m 鏡のデータシート https://www.nro.nao.ac.jp/en/projects/45m/datasheets/ （2026-11-18 に確認）
#   障害情報：NRO45m 障害情報 https://www.nro.nao.ac.jp/projects/45m/projects-45m-trouble/ （2026年11月12日更新の版）
#   技術シンポ2019：https://www2.nao.ac.jp/~open-info/engipromo/draftparts_2019/gk/tecsym19_Miyazawa_Chieko.pdf
#   年次報告YYYY：https://www.nao.ac.jp/contents/about/reports/annual-report-ja/annualYYYY-j.pdf
#   経緯：ハブの history/README.md https://github.com/nobeyama-radio-observatory/nro-context/blob/main/history/README.md
#   40周年記念誌：『野辺山宇宙電波観測所40周年記念誌』2022年2月（国立国会図書館 請求記号 MB12-M7）。p.N はそのページ。
#     書誌の詳細はハブの history/README.md の出典の略記。年次報告と食い違うときは年次報告を採る
#   聞き取りYYYY-MM-DD(-n) 問N：interviews/YYYY-MM-DD(-n).md の問N

- id: rx-h22
  name: H22
  kind: 受信機
  part_of: nro45m
  depends_on: [nro45m, if-system]
  status: 運用中
  offered: 提供
  introduced: 2005年に現在の形に改修。最初の導入の年は未記入
  maintenance: {by: 所内, condition: 低雑音増幅器（CLNA）を2022年度に更新し、性能が上がった, effort: 小}
  renewal: 当面は国際的な競争力を持つ（仮説）
  owner_role: 受信機チーム（装置システムグループ）
  maintainers: 2
  docs: データシート
  sources:
    - 状態と提供：データシート
    - 保守、更新の見込み、担い手の数、担当：聞き取り2026-11-18-2 問1、問3
    - 改修：40周年記念誌 p.46
  note: H40 または Z45 と同時に観測できる。H40 との同時観測は2018年に共同利用で開始（技術シンポ2019）

- id: rx-h40
  name: H40
  kind: 受信機
  part_of: nro45m
  depends_on: [nro45m, if-system]
  status: 運用中
  offered: 提供
  introduced: 45m 鏡の建設時から。2004年に現在の形に改修
  maintenance:
    by: 所内
    condition: 電波窓に霜がたまり性能が落ちるため、定期的に昇温と再冷却をする（例年は半年に一度ほど）。2026年11月は湿度が高く早めにたまった
    effort: 小
  renewal: 更新の予定はない。性能に競争力はないが、アンテナのポインティングを決める受信機として使い続ける
  owner_role: 受信機チーム（装置システムグループ）
  maintainers: 2
  docs: データシート
  sources:
    - 状態と提供：データシート
    - 保守：障害情報 Trouble ID 2026-3
    - 導入、手間、更新の見込み、担い手の数、担当：聞き取り2026-11-18-2 問1、問3、問6
    - 改修：40周年記念誌 p.46
  note: アンテナのポインティングを決める受信機（聞き取り2026-11-18-2 問3）

- id: rx-z45
  name: Z45
  kind: 受信機
  part_of: nro45m
  depends_on: [nro45m, if-system]
  status: 運用中
  offered: 提供
  introduced: 2013年度に搭載（科研費による持ち込みの受信機）。2016年度に機能を一部制限して共同利用に提供。受け入れの審査（acceptance review）を通過し、観測所で保守・運用している
  maintenance: {by: 所内, condition: 未記入, effort: 小}
  renewal: 同じ周波数帯の eQ（rx-eq）が稼働し始めると、運用を終える可能性がある（仮説）
  owner_role: 受信機チーム（装置システムグループ）
  maintainers: 2
  docs: データシート
  sources:
    - 状態と提供：データシート
    - 導入：年次報告2013、年次報告2016
    - 受け入れ、保守、更新の見込み、担い手の数、担当：聞き取り2026-11-18-2 問1、問3、問5

- id: rx-forest
  name: FOREST（4ビーム受信機）
  kind: 受信機
  part_of: nro45m
  depends_on: [nro45m, if-system]
  status: 運用中
  offered: 提供
  introduced: 2011年にファーストライト。2016年1月に機能を一部制限して共同利用に提供、2016年度から本格提供
  maintenance:
    by: 所内
    condition: 2026年11月に、受信機の機器を制御する計算機のソフトウェアが止まり、再起動で復旧
    effort: 小
  renewal: 同じ周波数帯の 7BEE（rx-7bee）が稼働し始めると、運用を終える可能性がある（仮説）
  owner_role: 受信機チーム（装置システムグループ）
  maintainers: 2
  docs: データシート
  sources:
    - 状態と提供：データシート
    - 導入：経緯（45m 鏡のページ、年次報告2015、年次報告2016）
    - 保守：障害情報 Trouble ID 2026-2
    - 手間、更新の見込み、担い手の数、担当：聞き取り2026-11-18-2 問1、問3
    - 2014年の改修と後継の位置づけ：40周年記念誌 p.48
  note: 2014年に、信号の安定と保守のしやすさのためにデュワーを全面的に置き換えた。BEARS と TZ の後継の位置づけ

- id: rx-hinotori-tz
  name: HINOTORI-TZ
  kind: 受信機
  part_of: nro45m
  depends_on: [nro45m, if-system]
  status: 運用中
  offered: リスクシェアで提供
  introduced: 前身の TZ（115 GHz、2ビーム）は2009年度に搭載し、FOREST の運用開始後、2018年に共同利用への提供を終えた。HINOTORI の開発は2016年度から。2019年に大学のグループ（HINOTORI）が改修・移設し、3周波の同時観測ができるようになる。HINOTORI-TZ-86G は受け入れの審査を通過し、リスクシェアで観測に公開した
  maintenance: {by: 所内、大学など外部, condition: まだ開発中の受信機。HINOTORI-TZ-230G の開発が始まり、同じ受信機の中に開発中の部分がある, effort: 中}
  renewal: 未記入
  owner_role: 受信機チーム（装置システムグループ）
  maintainers: 0
  docs: データシート
  sources:
    - 状態と提供：データシート
    - 導入：年次報告2009、技術シンポ2019
    - TZ の運用の終了、受け入れ、保守、担い手の数、担当：聞き取り2026-11-18-2 問1、問3、問5
    - TZ の提供の終了の年、HINOTORI の開発の開始：40周年記念誌 p.50、p.61
  note: maintainers は所内で単独で判断できる人の数（0）。大学のグループの人数は未記入。単一鏡の観測だけに提供し、VLBI モードは調整中で使えない（プロポーザルの募集 https://www.nro.nao.ac.jp/projects/45m/proposals/calls/ ）

